name: Update Knowledge Dashboard

on:
  schedule:
    - cron: "0 0 * * *" # Runs at 09:00 KST daily
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Update Data JSON
        run: |
          python3 _ops/scripts/update_dashboard.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Hermes Cloud Agent"
          git config --global user.email "hermes@agentic.engineering"
          git add _ops/web/data.json _ops/web/history.jsonl
          git commit -m "Cloud Sync: Dashboard Pulse Update [Automated]" || echo "No changes to commit"
          git push origin main
