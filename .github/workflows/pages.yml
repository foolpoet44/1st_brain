name: Deploy Pages (submodule-safe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress 는 반드시 true 여야 한다.
#
# 2026-08-07 사고: run #229 의 deploy 잡이 github-pages 환경에서 queued 상태로
# 영원히 멈췄다. cancel-in-progress: false 였기 때문에 그 실행이 pages 그룹을
# 계속 점유했고, 이후 밀려온 실행들은 배포되지 못한 채 서로를 밀어내며
# cancelled 로 사라졌다. cancelled 는 failed 가 아니라 알림도 오지 않는다.
# 그래서 6일 동안 아무도 모르게 사이트가 8/7 빌드에 얼어붙어 있었다.
#
# true 로 두면 새 푸시가 멈춘 실행을 밀어내고 자기가 배포한다. 이 저장소는
# 자동화가 하루에 여러 번 main 에 푸시하므로, '진행 중 배포를 지키는 것'보다
# '최신 상태가 반드시 나가는 것'이 압도적으로 중요하다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 멈춘 잡이 그룹을 무한정 붙들지 못하게 상한을 둔다. 실패는 알림이 오지만
    # 영원한 대기는 아무 신호도 남기지 않는다 — 조용한 정지가 가장 위험하다.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 지식 인덱스 데이터 생성 + 디버깅
      - name: Generate knowledge index
        run: |
          set -euo pipefail
          python3 _ops/scripts/gen_knowledge_index.py
          # 안쪽을 홑따옴표로 두면 바깥 홑따옴표와 충돌해 \" 가 그대로 파이썬에
          # 넘어가 SyntaxError 가 났다. 게다가 $( ) 실패는 echo 를 죽이지 않아
          # 그 오류가 로그에 보이지도 않았다. 따옴표 방향을 뒤집어 바로잡는다.
          python3 -c "
          import json
          docs = json.load(open('_data/knowledge.json'))
          dated = sum(1 for d in docs if d['date'])
          print(f'📊 총 {len(docs)}건 / 날짜 부여 {dated}건')
          print('📄 최신 5건:', [(d['date'], d['title']) for d in docs[:5]])
          "

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # 빌드 결과가 데이터와 실제로 일치하는지 확인한다. 여기서 수가 어긋나면
      # Jekyll 이 _data 를 못 읽은 것이고, 수가 맞는데 사이트가 옛날이면
      # 배포 단계가 막힌 것이다 — 두 원인을 이 한 줄로 갈라낸다.
      - name: Verify rendered index
        run: |
          set -euo pipefail
          grep -o '총 [0-9]* 개\|총 [0-9]*개' _site/knowledge/index.html || {
            echo "::error::_site/knowledge/index.html 에서 문서 수를 찾지 못했다"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # 2026-08-07 에 이 잡이 6일간 queued 로 멈춰 pages 그룹을 점유했다.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
