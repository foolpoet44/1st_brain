name: Deploy Pages (submodule-safe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 지식 인덱스 데이터 생성 + 디버깅
      - name: Generate knowledge index
        run: |
          echo "🔍 Before: _data/knowledge.json exists? $(test -f _data/knowledge.json && echo YES || echo NO)"
          echo "🔍 Running gen_knowledge_index.py..."
          python3 _ops/scripts/gen_knowledge_index.py
          echo "🔍 After: _data/knowledge.json exists? $(test -f _data/knowledge.json && echo YES || echo NO)"
          if [ -f _data/knowledge.json ]; then
            echo "📊 Document count: $(python3 -c 'import json; print(len(json.load(open(\"_data/knowledge.json\"))))')"
          fi

      # Jekyll 빌드 전 _data 확인
      - name: Debug _data directory
        run: |
          echo "📁 _data contents:"
          ls -la _data/ || echo "_data directory not found"
          if [ -f _data/knowledge.json ]; then
            echo "📊 knowledge.json size: $(wc -l < _data/knowledge.json) lines"
          fi

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # 빌드 후 _site 확인
      - name: Debug _site/knowledge.html
        run: |
          echo "📁 _site contents:"
          ls -la _site/ | head -20
          if [ -f _site/knowledge/index.html ]; then
            echo "📄 knowledge/index.html first 50 lines:"
            head -50 _site/knowledge/index.html | grep -E "(총|개|knowledge|data)"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
