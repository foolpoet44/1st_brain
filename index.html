<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>csp-brain Eval Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }
        .card h3 { color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .card .value { font-size: 2.5rem; font-weight: 700; }
        .card .unit { font-size: 1rem; color: #64748b; }
        .score-card { 
            border: 2px solid #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        .score-value { color: #ef4444; }
        .progress-bar {
            height: 8px;
            background: rgba(148, 163, 184, 0.2);
            border-radius: 4px;
            margin-top: 1rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .metric { 
            background: rgba(15, 23, 42, 0.5);
            padding: 1rem;
            border-radius: 0.5rem;
        }
        .metric label { color: #64748b; font-size: 0.75rem; }
        .metric .val { font-size: 1.25rem; font-weight: 600; margin-top: 0.25rem; }
        .timestamp { color: #475569; font-size: 0.875rem; text-align: center; margin-top: 2rem; }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #ef4444;
            color: #fff;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 csp-brain Eval Dashboard</h1>
        <p class="subtitle">지식 건강 상태 실시간 진단</p>
        
        <div class="grid">
            <div class="card score-card">
                <h3>EVAL SCORE</h3>
                <div class="value score-value">0.61<span class="unit">/100</span></div>
                <span class="status-badge">개선 필요</span>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0.61%"></div>
                </div>
            </div>
            
            <div class="card">
                <h3>TOTAL DOCUMENTS</h3>
                <div class="value">7689<span class="unit">개</span></div>
                <div class="metrics" style="margin-top: 1rem;">
                    <div class="metric">
                        <label>Type 문서</label>
                        <div class="val">0개</div>
                    </div>
                    <div class="metric">
                        <label>Active 문서</label>
                        <div class="val">34개</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h3>KNOWLEDGE DENSITY</h3>
                <div class="value">0.11<span class="unit">링크/문서</span></div>
                <div class="metrics" style="margin-top: 1rem;">
                    <div class="metric">
                        <label>총 연결</label>
                        <div class="val">809개</div>
                    </div>
                    <div class="metric">
                        <label>고립 문서</label>
                        <div class="val">7438개 (96.74%)</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h3>METABOLISM</h3>
                <div class="value">0.49<span class="unit">%</span></div>
                <div class="metric" style="margin-top: 1rem;">
                    <label>최근 7 일 수정 (38개)</label>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0.49%"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h3>SCORE BREAKDOWN</h3>
            <div class="metrics" style="margin-top: 1rem;">
                <div class="metric">
                    <label>Link Density (40%)</label>
                    <div class="val">0.42점</div>
                </div>
                <div class="metric">
                    <label>Freshness (30%)</label>
                    <div class="val">0.15점</div>
                </div>
                <div class="metric">
                    <label>Type Structure (20%)</label>
                    <div class="val">0.0점</div>
                </div>
                <div class="metric">
                    <label>Active Rate (10%)</label>
                    <div class="val">0.04점</div>
                </div>
            </div>
        </div>
        
        <p class="timestamp">Last updated: 2026-07-19T08:50:56.995896</p>
    </div>
</body>
</html>
