<!DOCTYPE html>
<html lang="ko">
<head>

  <title>{{theme}} - ThinkLog Report</title>
  <style>
    :root { --accent: #2563eb; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #fafafa; color: #171717; line-height: 1.6; padding: 48px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 32px; margin-bottom: 8px; }
    .meta { color: #737373; font-size: 14px; margin-bottom: 32px; }
    .card { background: white; border: 1px solid #e5e5e5; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .card h2 { font-size: 18px; color: var(--accent); margin-bottom: 16px; }
    ul { padding-left: 20px; }
    li { margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e5e5e5; }
    th { font-weight: 600; color: #737373; font-size: 12px; text-transform: uppercase; }
  </style>
</head>

</html>
